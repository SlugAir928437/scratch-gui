name: CI

on:
  push:
    tags:
      - 'v*'  # 推送 v 开头的标签时触发
  pull_request:
  workflow_dispatch:
  
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
    
    - name: Install Dependencies
      run: npm ci
    
    - name: Build
      run: npm run build
      
    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v4.6.2
      with:
        name: build.zip
        path: /home/runner/work/scratch-gui/scratch-gui/*
